<section>
<h2>اليوم 1: النظام ومسؤول حماية البيانات الشخصية</h2>
<ol>
<li><p>تريد الموارد البشرية في قُرب استعمال أسباب الإجازات المرضية للموظفين في نموذج يتوقع من سيغيب أكثر، وتقترح المصلحة المشروعة أساسًا. ما الحكم؟</p><ul><li><b>أ.</b> تصلح إذا كُتب تقويم المصلحة المشروعة قبل البدء</li><li><b>ب.</b> لا تصلح، فأسباب الإجازات بيانات صحية</li><li><b>ج.</b> تكفي موافقة الموظف الضمنية في عقد العمل</li><li><b>د.</b> لا يلزم أساس، فالبيانات داخل الجهة</li></ul></li>
<li><p>موظفة في قُرب شاركت في تحدي المشي بموافقتها الصريحة ستة أسابيع، ثم سحبت موافقتها. كانت خطواتها قد أُرسلت إلى شركة الجوائز المنظِّمة. ما الذي يلزم قُرب؟</p><ul><li><b>أ.</b> إبلاغ الجهة المختصة بأن معالجة الأسابيع الستة صارت غير مشروعة</li><li><b>ب.</b> الاستمرار حتى نهاية التحدي ثم الإيقاف</li><li><b>ج.</b> إيقاف المعالجة خلال 30 يومًا من السحب</li><li><b>د.</b> الإيقاف دون تأخير، وإبلاغ شركة الجوائز وطلب إتلافها</li></ul></li>
<li><p>شركة خاصة لتوصيل البقالة تتتبع موقع كل عميل وكل مندوب لحظة بلحظة لتوزيع الطلبات، وتبني من ذلك أنماط الشراء. لا تعالج بيانات صحية. هل يلزمها تعيين مسؤول لحماية البيانات الشخصية؟</p><ul><li><b>أ.</b> نعم، نشاطها الأساسي يتطلب مراقبة منتظمة وممنهجة</li><li><b>ب.</b> لا، فلا بيانات حساسة في نشاطها</li><li><b>ج.</b> لا، فالتعيين للجهات العامة التي تعالج على نطاق واسع فقط</li><li><b>د.</b> نعم إذا زاد موظفوها على مئة</li></ul></li>
<li><p>يطلب منك مدير الموارد البشرية في قُرب أن تضيف إلى سجل أنشطة المعالجة حقل «رقم مرجع آخر تقويم أثر»، لأنه «مطلوب بالنظام». وجدت الحقل في نموذج السجل الذي نشرته سدايا. ما حالته؟</p><ul><li><b>أ.</b> نص نافذ يجب الالتزام به</li><li><b>ب.</b> مسودة لا تُطبق قبل نشرها في الجريدة الرسمية</li><li><b>ج.</b> إرشاد من دليل غير ملزم، وإضافته ممارسة جيدة</li><li><b>د.</b> غير موجود في أي نص، فيُرفض</li></ul></li>
<li><p>صالة رياضية خاصة تريد فتح بوابتها ببصمة الإصبع، وتعتمد على موافقة الأعضاء أساسًا لذلك. ما الذي يلزمها في هذه الموافقة؟</p><ul><li><b>أ.</b> موافقة صريحة موثقة لهذا الغرض وحده، تُطلب قبل تسجيل البصمة</li><li><b>ب.</b> موافقة ضمنية تُستنتج من استمرار العضو في استعمال البوابة</li><li><b>ج.</b> بند عام في عقد العضوية يغطي هذا الغرض مع باقي أغراض الصالة</li><li><b>د.</b> لا يلزمها شيء، فأمن المبنى مصلحة مشروعة تغني عن الموافقة</li></ul></li>
<li><p>جهة حكومية تقدم خدمة إلكترونية واسعة تريد تحليل سجلات الدخول لكشف الاحتيال، ويقترح فريقها الاستناد إلى المصلحة المشروعة. ما الحكم؟</p><ul><li><b>أ.</b> يصح، فكشف الاحتيال مذكور في اللائحة مثالًا على المصلحة المشروعة</li><li><b>ب.</b> يصح بعد تقويم موثق يوازن بين مصلحتها وحقوق المستفيدين</li><li><b>ج.</b> لا يصح هذا الأساس لجهة عامة، فتبحث عن أساس نظامي آخر</li><li><b>د.</b> يصح إذا أضافت إليه موافقة المستفيدين على التحليل</li></ul></li>
<li><p>طلب موظف سابق من إدارة الموارد البشرية نسخة من بياناته، وجزء منها في أرشيف ورقي يحتاج جمعه جهدًا غير متناسب مع المهلة. إذا أرادت الإدارة وقتًا إضافيًا، فما الذي تلتزم به؟</p><ul><li><b>أ.</b> تمديد مفتوح حتى يكتمل جمع الأرشيف، ما دام الطلب مسجلًا لديها</li><li><b>ب.</b> تمديد واحد حتى 30 يومًا، يُبلَّغ به الموظف مسبقًا مع السبب</li><li><b>ج.</b> تمديد 30 يومًا دون إبلاغ، ما دام الرد يصل قبل نهاية التمديد</li><li><b>د.</b> تمديد 90 يومًا، وهي مهلة الشكوى إلى الجهة المختصة</li></ul></li>
<li><p>وافقت موظفة على نشر صورتها في النشرة الداخلية، ثم سحبت موافقتها بعد صدور ثلاثة أعداد أُرسل أحدها إلى شركة طباعة. ما الذي يلزم الإدارة؟</p><ul><li><b>أ.</b> سحب الأعداد الثلاثة كلها من كل مكان نُشرت فيه، فالسحب يُبطل ما قبله</li><li><b>ب.</b> الاستمرار في النشر حتى نهاية السنة، فالموافقة أُعطيت لسنة كاملة</li><li><b>ج.</b> طلب سبب السحب منها كتابةً قبل قبوله وإيقاف النشر</li><li><b>د.</b> التوقف دون تأخير، وطلب الإتلاف ممن أُفصح لهم، دون مساس بالأعداد السابقة</li></ul></li>
<li><p>أي هذه الجهات تلزمها المادة 32 من اللائحة بتعيين مسؤول لحماية البيانات الشخصية؟</p><ul><li><b>أ.</b> شركة تسويق كبيرة تحفظ قائمة عملاء طويلة دون تتبع لسلوكهم</li><li><b>ب.</b> جهة حكومية صغيرة لا تعالج إلا بيانات موظفيها</li><li><b>ج.</b> شركة خاصة نشاطها الأساسي تحليل الفحوص المخبرية للمرضى</li><li><b>د.</b> مكتب محاماة صغير يحفظ ملفات موظفيه وعملائه</li></ul></li>
<li><p>يقول زميل في الشؤون القانونية: «الدليل الاسترشادي لسياسة الخصوصية يلزمنا بنموذجه حرفيًا، ومخالفته مخالفة للنظام». ما الرد الأدق؟</p><ul><li><b>أ.</b> الدليل غير ملزم بنصه، والإلزام في النظام ولائحته</li><li><b>ب.</b> صحيح، فكل ما يُنشر في صفحة الأنظمة والسياسات نافذ بالقدر نفسه</li><li><b>ج.</b> صحيح بعد مرور سنة على نشر الدليل</li><li><b>د.</b> الدليل ملزم للجهات العامة وحدها</li></ul></li>
<li><p>قرأ زميل على منصة استطلاع مشروعًا لتعديل مادة في اللائحة التنفيذية تخص عمل إدارته، فطلب تغيير الإجراء الداخلي فورًا. ما الحكم الآن؟</p><ul><li><b>أ.</b> يُعمل بالمشروع من يوم نشره على منصة استطلاع</li><li><b>ب.</b> يُعمل به بعد انتهاء مدة المشاورة المعلنة على المنصة دون حاجة إلى نشر</li><li><b>ج.</b> يبقى النص الحالي نافذًا حتى يُنشر التعديل في الجريدة الرسمية</li><li><b>د.</b> يُعمل به إذا لم تعترض الجهة عليه أثناء المشاورة</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: السجلات وتدفقات البيانات</h2>
<ol>
<li><p>جمعت الموارد البشرية في قُرب أوقات دخول الموظفين بالبطاقة لأمن المبنى. يريد مدير إدارة أن يستعملها لتقويم انضباط فريقه في التقييم السنوي. ما أول ما يقوله المسؤول؟</p><ul><li><b>أ.</b> لا مانع، فالبيانات في نظام الجهة نفسها</li><li><b>ب.</b> غرض جديد يحتاج أساسًا، وإبلاغًا قبل المعالجة، وقيدًا في السجل</li><li><b>ج.</b> يكفي أن يوقّع كل موظف موافقة عامة على استعمال بياناته في التقييم والانضباط</li><li><b>د.</b> تُحذف أوقات الدخول كلها حتى لا تُستعمل لغير غرضها</li></ul></li>
<li><p>تتعاقد شركة الرواتب التي تخدم قُرب مع شركة طباعة ترسل كشوف الرواتب الورقية إلى بعض الموظفين. لم تُبلغ قُرب بذلك. ما دور شركة الطباعة، وما الذي ينقص؟</p><ul><li><b>أ.</b> جهة تحكم مستقلة، تحتاج أساسًا للإفصاح</li><li><b>ب.</b> لا دور لها في سجل قُرب، فالعقد ليس معها</li><li><b>ج.</b> جهة معالجة فرعية تحتاج قبول قُرب المسبق</li><li><b>د.</b> جهة نقل خارجي، تحتاج تقويم مخاطر النقل</li></ul></li>
<li><p>أربعة قيود في سجل الموارد البشرية، كلها مكتملة الخانات. أيها يحتاج أن يُعلَّم «يحتاج قرارًا»؟</p><ul><li><b>أ.</b> ملفات الإجازات المرضية: الأساس «مصلحة مشروعة»</li><li><b>ب.</b> دليل الهاتف الداخلي: المستلمون «لا يوجد»</li><li><b>ج.</b> ملفات الرواتب: المدة 10 سنوات بموجب متطلب محاسبي</li><li><b>د.</b> الاستقطاب: منصة سحابية مستضافة داخل المملكة</li></ul></li>
<li><p>إشعار المتقدمين للوظائف في قُرب يذكر هوية قُرب والتواصل مع المسؤول، والغرض والأساس، والحقول الإلزامية والاختيارية، والمدة، والحقوق. وترسل قُرب السير إلى شركة تقويم نفسي. أي عنصر ينقصه؟</p><ul><li><b>أ.</b> أسماء الأنظمة التي تُحفظ فيها البيانات</li><li><b>ب.</b> وصف تفصيلي لتدابير الأمن التقنية</li><li><b>ج.</b> نص المادة النظامية لكل غرض</li><li><b>د.</b> الجهة التي تُرسل إليها السير وصفتها</li></ul></li>
<li><p>انتهت مدة الاحتفاظ بسير المتقدمين غير المقبولين في قُرب. نقلها الفريق من نظام التوظيف إلى مجلد «أرشيف» يقرؤه المدير وحده. هل هذا إتلاف؟</p><ul><li><b>أ.</b> نعم، فلا يصل إليها إلا شخص واحد</li><li><b>ب.</b> لا، فالسير باقية ويمكن استرجاعها</li><li><b>ج.</b> نعم، ما دام الملف خرج من نظام التوظيف</li><li><b>د.</b> لا يلزم إتلاف ما لم يطلبه المتقدم</li></ul></li>
<li><p>نظام الرواتب في إدارة الموارد البشرية يُنسخ احتياطيًا كل يوم لدى مزود سحابي، ووثيقة المزود تذكر أن مركز البيانات داخل المملكة ولا جهة فرعية له خارجها. ماذا يُكتب في سجل أنشطة المعالجة لهذا النشاط؟</p><ul><li><b>أ.</b> لا شيء، فالنسخ الاحتياطي إجراء تقني لا معالجة</li><li><b>ب.</b> وصف نقل إلى خارج المملكة وأساسه النظامي، احتياطًا لأن الخدمة سحابية</li><li><b>ج.</b> موافقة كل موظف مرفقة بقيد النشاط</li><li><b>د.</b> المزود جهة معالجة بين المستلمين، و«لا يوجد» في خانة النقل</li></ul></li>
<li><p>أُوقف نشاط «استقطاب المتدربين» في إدارة الموارد البشرية نهائيًا. ماذا يحدث لقيده في سجل أنشطة المعالجة؟</p><ul><li><b>أ.</b> يُحذف فورًا، فالسجل للأنشطة القائمة وحدها</li><li><b>ب.</b> يُحفظ خمس سنوات من تاريخ انتهاء النشاط</li><li><b>ج.</b> يُحفظ سنة واحدة ثم يُحذف مع بيانات المتدربين</li><li><b>د.</b> يُسلَّم إلى الجهة المختصة لتحفظه بدل الجهة</li></ul></li>
<li><p>تتعاقد إدارة الموارد البشرية مع شركة خارجية لمعالجة الرواتب نيابة عنها. أي بند تشترط المادة 17 من اللائحة وجوده في الاتفاق؟</p><ul><li><b>أ.</b> حق الشركة في استعمال البيانات لتطوير خدماتها الأخرى</li><li><b>ب.</b> إعفاء الإدارة من المسؤولية عن أي مخالفة ترتكبها الشركة</li><li><b>ج.</b> موافقة كل موظف على الاتفاق قبل توقيعه</li><li><b>د.</b> التزام الشركة بإبلاغ الإدارة دون تأخير إذا وقع تسرب</li></ul></li>
<li><p>نموذج التقديم على وظيفة إدارية يطلب فصيلة الدم والحالة الاجتماعية وصورة الهوية الوطنية. ما الإجراء وفق مبدأ الحد الأدنى؟</p><ul><li><b>أ.</b> إبقاء الحقول مع جعلها اختيارية للمتقدم</li><li><b>ب.</b> إبقاؤها مع تشفير قاعدة بيانات المتقدمين</li><li><b>ج.</b> حذف كل حقل لا يلزم لتقويم المتقدم للوظيفة</li><li><b>د.</b> إبقاؤها إذا وافق المتقدم على سياسة الخصوصية</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 3: تقويم الأثر</h2>
<ol>
<li><p>قيد «استبانة رضا الموظفين» في سجل الموارد البشرية: الأداة سحابية، والمقابلة تقول «داخل المملكة»، ووثيقة المورد تذكر استضافة في دولة أخرى. ماذا يُكتب في خانة النقل؟</p><ul><li><b>أ.</b> «لا يوجد»، كما قالت المقابلة</li><li><b>ب.</b> تُترك فارغة حتى يتأكد المسؤول من المورد</li><li><b>ج.</b> الدولة الأخرى، ويُعلَّم «يحتاج قرارًا»</li><li><b>د.</b> «داخل المملكة بعد نقل الاستضافة»</li></ul></li>
<li><p>تريد الموارد البشرية في قُرب إضافة سؤال اختياري في نموذج الإجازة: «هل الإجازة لرعاية فرد مريض من الأسرة؟»، وتحفظ الإجابة في نظام الإجازات القائم. ما القرار؟</p><ul><li><b>أ.</b> لا يلزم، فالسؤال اختياري</li><li><b>ب.</b> لا يلزم، فالنظام قائم وله قيد في السجل</li><li><b>ج.</b> يلزم تقويم مخاطر نقل لا تقويم أثر</li><li><b>د.</b> يلزم، فالإجابة بيانات صحية</li></ul></li>
<li><p>مستخلص استبانة رضا الموظفين في قُرب: حُذفت الأسماء والأرقام الوظيفية نهائيًا ولا مفتاح لها، وعُممت الأعمار إلى فئات عشرية، وبقي اسم الإدارة. في الشؤون القانونية موظف واحد في الخمسينات. ما الحكم؟</p><ul><li><b>أ.</b> مجهول الهوية، فلا أسماء ولا مفتاح</li><li><b>ب.</b> مرمّز، فالمستخلص مأخوذ من نظام فيه الأسماء</li><li><b>ج.</b> مجهول ما دام لا يُنشر خارج الموارد البشرية</li><li><b>د.</b> ليس مجهولًا بعد، ففئة من شخص واحد تكشف صاحبها</li></ul></li>
<li><p>يكتب فريق الموارد البشرية مخاطر أداة فرز السير. أي صياغة تصلح سطرًا في سجل المخاطر؟</p><ul><li><b>أ.</b> غرامة على قُرب إن خالفت الأداة النظام</li><li><b>ب.</b> عدم وجود سياسة مكتوبة لاستخدام الأداة</li><li><b>ج.</b> متقدمة مؤهلة تُستبعد آليًا فتخسر الفرصة</li><li><b>د.</b> مخاطر الذكاء الاصطناعي على الخصوصية</li></ul></li>
<li><p>خطر في أداة فرز السير: «المورد يستعمل السير في تدريب نماذجه دون علم أصحابها»، جسامة 2 واحتمال 3. أي ضابط يخفض الاحتمال فعلًا؟</p><ul><li><b>أ.</b> بند تعاقدي يمنع المورد من التدريب عليها</li><li><b>ب.</b> تنبيه للمتقدمين بأن السير قد تُعالج آليًا</li><li><b>ج.</b> تشفير السير قبل إرسالها إلى أداة المورد</li><li><b>د.</b> تدريب فريق التوظيف على حماية البيانات</li></ul></li>
<li><p>أي هذه الأنشطة في إدارة الموارد البشرية يستوجب تقويم الأثر بحسب المادة 25 من اللائحة؟</p><ul><li><b>أ.</b> نقل نظام الرواتب إلى خادم جديد داخل الجهة دون تغيير البيانات أو الغرض</li><li><b>ب.</b> ربط سجلات الحضور ببيانات الرواتب من نظام آخر لاحتساب الخصومات آليًا</li><li><b>ج.</b> إضافة أسماء الموظفين وتحويلاتهم الهاتفية إلى دليل داخلي</li><li><b>د.</b> إرسال كشف شهري لكل موظف عن راتبه وحده</li></ul></li>
<li><p>حذفت وحدة عقود جهات العمل جدول الربط نهائيًا فلا مفتاح في أي مكان، وعممت شبه المعرّفات حتى صار في كل فئة عشرة سجلات على الأقل، واختبرت الربط بدليل الموظفين المتاح لها فلم يطابق أي سجل اسمًا واحدًا، ووثقت ذلك. كيف يُعامل المستخلص؟</p><ul><li><b>أ.</b> مرمّز، فالرموز باقية في الجدول ولو حُذف المفتاح نهائيًا</li><li><b>ب.</b> مجهول الهوية، ويُعاد الاختبار كلما تغير المستخلص أو القوائم المتاحة</li><li><b>ج.</b> بيانات شخصية دائمًا، لأنها أُخذت أصلًا من بيانات شخصية</li><li><b>د.</b> مجهول الهوية نهائيًا، فلا يحتاج الحكم إلى مراجعة ما دام الاختبار قد وُثق مرة</li></ul></li>
<li><p>في مستخلص لموظفي إحدى الوحدات حُذفت الأسماء، وعُمِّم العمر إلى فئات عشرية، وبقي اسم القسم. في قسم واحد موظفة واحدة في الخمسينات. ما التقدير؟</p><ul><li><b>أ.</b> لا خطر، فالأسماء محذوفة</li><li><b>ب.</b> الخطر في حقل العمر وحده، فيكفي حذفه</li><li><b>ج.</b> يمكن التعرف عليها من القسم وفئة العمر، فالمستخلص ليس مجهول الهوية بعد</li><li><b>د.</b> الخطر قائم فقط إذا نُشر المستخلص للعامة</li></ul></li>
<li><p>أظهر تقويم الأثر لخدمة جديدة أنها ستضر بخصوصية أصحاب البيانات حتى بعد الضوابط المقترحة. ما الذي تطلبه اللائحة؟</p><ul><li><b>أ.</b> المضي مع توثيق قبول الإدارة العليا للخطر في محضر</li><li><b>ب.</b> إرسال التقويم إلى الجهة المختصة وانتظار موافقتها</li><li><b>ج.</b> إبلاغ أصحاب البيانات بالخطر ثم المضي</li><li><b>د.</b> معالجة أسباب الضرر، ثم إعادة التقويم</li></ul></li>
<li><p>خطر في إدارة الموارد البشرية: كل موظفيها يطّلعون على التقارير الطبية لطلبات الإجازة المرضية. أي ضابط يعالج سبب الخطر نفسه؟</p><ul><li><b>أ.</b> صلاحيات بحسب الدور للمختصة بالإجازات</li><li><b>ب.</b> تدريب سنوي لكل موظفي الإدارة على السرية</li><li><b>ج.</b> إضافة تنبيه «سري» أعلى كل تقرير</li><li><b>د.</b> تشفير القرص الذي تُحفظ عليه التقارير</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 4: الحقوق والنقل والتسرب</h2>
<ol>
<li><p>خطر في نظام الإجازات: «تقارير طبية مرفقة تبقى في النظام بلا مدة»، جسامة 3 واحتمال 4. يقترح الفريق ثلاثة ضوابط. أيها يخفض الاحتمال فعلًا؟</p><ul><li><b>أ.</b> رسالة سنوية تذكّر الموظفين بحذف مرفقاتهم القديمة</li><li><b>ب.</b> تشفير قاعدة بيانات نظام الإجازات</li><li><b>ج.</b> حذف آلي للمرفق بعد اعتماد الإجازة بمدة محددة</li><li><b>د.</b> حصر الاطلاع على المرفقات في موظف واحد</li></ul></li>
<li><p>اليوم 2027-03-01 في الموارد البشرية. ثلاثة طلبات: تصحيح استُلم في 2027-02-05، ونسخة استُلمت في 2027-02-20، وإتلاف وصل إلى مكتبك اليوم لكنه استُلم في 2027-02-08. بأيها تبدأ؟</p><ul><li><b>أ.</b> الإتلاف، فقد وصل اليوم وهو الأحدث على المكتب</li><li><b>ب.</b> التصحيح، فمهلته أقربها انقضاءً</li><li><b>ج.</b> النسخة، فحق الاطلاع أهم الحقوق</li><li><b>د.</b> أيها، فكلها تُمدد ثلاثين يومًا عند الحاجة</li></ul></li>
<li><p>رد الموارد البشرية على طلب نسخة من ملف تحقيق داخلي: «نرفض طلبكم لأن الملف يذكر موظفين آخرين. مع التحية.» ما الخطأ الأهم؟</p><ul><li><b>أ.</b> لا خطأ، فالرفض مسبب بحماية الآخرين</li><li><b>ب.</b> ينقصه رقم المادة فقط</li><li><b>ج.</b> كان يجب إحالة الطلب إلى الجهة المختصة</li><li><b>د.</b> رفض الكل بدل الحجب، ولا حق شكوى ولا تواصل مع المسؤول</li></ul></li>
<li><p>تريد الموارد البشرية إرسال تقارير اللياقة الطبية للموظفين الجدد بصفة مستمرة إلى مركز فحص في الخارج يحمل شهادة اعتماد، لخدمة يطلبها الموظف. ما الحكم في الحالة (د)؟</p><ul><li><b>أ.</b> تنطبق، فالمستلم يحمل شهادة اعتماد</li><li><b>ب.</b> تنطبق، فالخدمة يطلبها الموظف نفسه</li><li><b>ج.</b> لا تنطبق، فالتقارير بيانات صحية حساسة</li><li><b>د.</b> لا تنطبق، فالنقل مستمر</li></ul></li>
<li><p>في مثال كشف الرواتب: علمت الجهة في الساعة 10، ووصل البلاغ إلى المسؤول في الساعة 22. في الساعة 70 لم يُعرف بعد كم موظفًا فتح الكشف. ما الذي يفعله المسؤول؟</p><ul><li><b>أ.</b> يرسل قبل الساعة 82 بعدد تقريبي، ويستكمل لاحقًا مع المبرر</li><li><b>ب.</b> ينتظر حتى الساعة 94 ليكتمل العدد</li><li><b>ج.</b> لا إشعار، فالخطأ بشري لا هجوم</li><li><b>د.</b> يُشعر الموظفين وحدهم، فهم أصحاب البيانات</li></ul></li>
<li><p>وصل إلى إدارة الموارد البشرية بريد من عنوان شخصي غير مسجل لديها، يطلب باسم موظف حالي نسخة من ملفه. ما الخطوة الأولى؟</p><ul><li><b>أ.</b> إرسال الملف إلى العنوان نفسه، فالموظف صاحب الحق</li><li><b>ب.</b> رفض الطلب، فالطلبات لا تُقبل إلا من البريد الرسمي</li><li><b>ج.</b> انتظار حضوره شخصيًا قبل تسجيل الطلب</li><li><b>د.</b> تسجيل الطلب والتحقق من هوية الطالب قبل الإفصاح</li></ul></li>
<li><p>احتاجت وحدة عقود جهات العمل تمديدًا للرد على طلب تصحيح، وأبلغت صاحبه مسبقًا مع السبب. ما أقصى مجموع للمهلة من يوم الاستلام؟</p><ul><li><b>أ.</b> 30 يومًا</li><li><b>ب.</b> 45 يومًا</li><li><b>ج.</b> 60 يومًا</li><li><b>د.</b> 90 يومًا</li></ul></li>
<li><p>أرسل متقدم سابق على وظيفة طلب نسخة من بياناته للمرة الثانية بعد ثلاثة أسابيع من الرد الكامل على طلبه الأول. وفي هذه المدة أضافت الإدارة إلى ملفه ملاحظات مقابلة ثانية. ما الرد المناسب؟</p><ul><li><b>أ.</b> رفض الطلب لتكراره، مع إبلاغه بسبب الرفض</li><li><b>ب.</b> تنفيذه في مهلته بنسخة تشمل ما أُضيف إلى ملفه بعد الرد الأول</li><li><b>ج.</b> تجاهل الطلب، فقد أُجيب عن مثله قبل أسابيع</li><li><b>د.</b> إحالة الطلب إلى الجهة المختصة لتقرر بنفسها هل هو طلب متكرر</li></ul></li>
<li><p>رُفض طلب موظف، فسأل في رد الإدارة: إلى متى يمكنني تقديم شكوى إلى الجهة المختصة؟ ما الذي يُكتب له؟</p><ul><li><b>أ.</b> خلال 30 يومًا من تاريخ الرفض</li><li><b>ب.</b> خلال سنة من تاريخ تقديم الطلب</li><li><b>ج.</b> لا مدة للشكوى ما دامت البيانات محفوظة</li><li><b>د.</b> خلال 90 يومًا من الواقعة أو العلم بها</li></ul></li>
<li><p>شركة خاصة جزء من مجموعة دولية تريد إرسال بيانات موظفيها إلى المقر الرئيسي في دولة أخرى لإدارة الرواتب مركزيًا. أي حالة من حالات الإعفاء في لائحة النقل تناسبها، وبأي ضمانة؟</p><ul><li><b>أ.</b> حالة النقل غير المتكرر أو المحدود، فالرواتب تُرسل مرة واحدة في نهاية كل شهر</li><li><b>ب.</b> حالة البحث العلمي، فالتحليل المركزي للرواتب دراسة للبيانات</li><li><b>ج.</b> لا تحتاج حالة ولا ضمانة، فالمستلم من المجموعة نفسها</li><li><b>د.</b> العمليات المركزية في مجموعة متعددة الجنسيات، بقواعد ملزمة أو بنود قياسية</li></ul></li>
<li><p>اكتشفت شركة أن البنود التعاقدية القياسية التي بنت عليها استثناء نقل لم تُوقَّع فعلًا مع المستلم في الخارج، والنقل جارٍ. ما الذي تلزمها به لائحة النقل؟</p><ul><li><b>أ.</b> إيقاف النقل وإبلاغ المستلمين</li><li><b>ب.</b> الاستمرار وتوقيع البنود في التجديد السنوي</li><li><b>ج.</b> الاستمرار ما دام المستلم ملتزمًا بالحماية عمليًا</li><li><b>د.</b> إبلاغ أصحاب البيانات والاستمرار</li></ul></li>
<li><p>مزود في الخارج يتلقى بيانات موظفي جهة بضمانة صحيحة، ويريد إحالة جزء منها إلى متعاقد من الباطن في دولة ثالثة. ما الحكم؟</p><ul><li><b>أ.</b> يسري النظام على النقل اللاحق، فيلزم ضمانة وقبول الجهة</li><li><b>ب.</b> الإحالة خارج نطاق النظام، فالبيانات غادرت المملكة</li><li><b>ج.</b> يكفي إبلاغ الجهة بعد الإحالة</li><li><b>د.</b> يجوز إذا كان المتعاقد في دولة لها نظام حماية بيانات معترف به</li></ul></li>
<li><p>علمت إدارة الموارد البشرية بتسرب ملف رواتب، ولم يصل الخبر إلى مسؤول حماية البيانات إلا بعد 20 ساعة. كم بقي للمسؤول من مهلة إشعار الجهة المختصة؟</p><ul><li><b>أ.</b> 52 ساعة</li><li><b>ب.</b> 72 ساعة</li><li><b>ج.</b> 48 ساعة</li><li><b>د.</b> 24 ساعة</li></ul></li>
<li><p>اقتربت نهاية مهلة الإشعار ولم يُعرف بعد العدد الدقيق للمتأثرين. ما الذي تفعله الجهة؟</p><ul><li><b>أ.</b> تؤجل الإشعار حتى يكتمل التحقيق ويُعرف العدد الدقيق للمتأثرين</li><li><b>ب.</b> ترسله في المهلة بعدد تقريبي، وتستكمل الباقي لاحقًا مع مبرر</li><li><b>ج.</b> ترسل الإشعار دون أي ذكر للعدد</li><li><b>د.</b> تبلغ الهيئة الوطنية للأمن السيبراني بدل الجهة المختصة</li></ul></li>
<li><p>مسودة إشعار للموظفين المتأثرين بتسرب ملف الرواتب تصف ما حدث وتذكر وسيلة التواصل مع المسؤول. ما الذي ينقصها مما تطلبه المادة 24(5)؟</p><ul><li><b>أ.</b> اسم الموظف الذي تسبب في التسرب</li><li><b>ب.</b> رقم البلاغ الأمني الداخلي</li><li><b>ج.</b> وصف المخاطر وما اتُّخذ لتقليلها، والنصائح للموظف</li><li><b>د.</b> الأساس النظامي لمعالجة الرواتب ومدة الاحتفاظ بها في الإدارة</li></ul></li>
<li><p>من أين يُرسل إشعار الجهة المختصة بتسرب البيانات الشخصية بحسب الدليل الإجرائي؟</p><ul><li><b>أ.</b> من خدمة الإشعار في منصة حوكمة البيانات الوطنية</li><li><b>ب.</b> من بريد الهيئة الوطنية للأمن السيبراني</li><li><b>ج.</b> من صفحة الأخبار في موقع الجهة نفسها</li><li><b>د.</b> من منصة استطلاع</li></ul></li>
</ol>

وارد البشرية نسخة من بياناته، وجزء منها في أرشيف ورقي يحتاج جمعه جهدًا غير متناسب مع المهلة. إذا أرادت الإدارة وقتًا إضافيًا، فما الذي تلتزم به؟","options":[{"key":"أ","text":"تمديد مفتوح حتى يكتمل جمع الأرشيف، ما دام الطلب مسجلًا لديها"},{"key":"ب","text":"تمديد واحد حتى 30 يومًا، يُبلَّغ به الموظف مسبقًا مع السبب"},{"key":"ج","text":"تمديد 30 يومًا دون إبلاغ، ما دام الرد يصل قبل نهاية التمديد"},{"key":"د","text":"تمديد 90 يومًا، وهي مهلة الشكوى إلى الجهة المختصة"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة 3(1)(أ) من اللائحة: الرد خلال 30 يومًا، ويجوز تمديد واحد لا يتجاوز 30 يومًا إضافية بشرط إبلاغ صاحب البيانات مسبقًا مع أسباب التأخير.","misconceptions":["المادة 3 تحدد سقف التمديد بثلاثين يومًا إضافية.","","الإبلاغ المسبق بالتمديد وسببه شرط فيه، لا إجراء اختياري.","مهلة التسعين يومًا للشكوى إلى الجهة المختصة (المادة 37)، لا للرد على الطلب."],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo1-4","type":"single","prompt":"وافقت موظفة على نشر صورتها في النشرة الداخلية، ثم سحبت موافقتها بعد صدور ثلاثة أعداد أُرسل أحدها إلى شركة طباعة. ما الذي يلزم الإدارة؟","options":[{"key":"أ","text":"سحب الأعداد الثلاثة كلها من كل مكان نُشرت فيه، فالسحب يُبطل ما قبله"},{"key":"ب","text":"الاستمرار في النشر حتى نهاية السنة، فالموافقة أُعطيت لسنة كاملة"},{"key":"ج","text":"طلب سبب السحب منها كتابةً قبل قبوله وإيقاف النشر"},{"key":"د","text":"التوقف دون تأخير، وطلب الإتلاف ممن أُفصح لهم، دون مساس بالأعداد السابقة"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة 12 من اللائحة: التوقف دون تأخير غير مبرر، وإبلاغ من أُفصح لهم وطلب الإتلاف، ولا يمس السحب مشروعية المعالجة قبله.","misconceptions":["السحب لا يمس مشروعية ما عولج قبله (المادة 12(3)).","السحب حق في أي وقت، ويوقف المعالجة دون تأخير غير مبرر.","السحب لا يحتاج سببًا، ويجب أن يكون سهلًا كالموافقة أو أسهل.",""],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo1-5","type":"single","prompt":"أي هذه الجهات تلزمها المادة 32 من اللائحة بتعيين مسؤول لحماية البيانات الشخصية؟","options":[{"key":"أ","text":"شركة تسويق كبيرة تحفظ قائمة عملاء طويلة دون تتبع لسلوكهم"},{"key":"ب","text":"جهة حكومية صغيرة لا تعالج إلا بيانات موظفيها"},{"key":"ج","text":"شركة خاصة نشاطها الأساسي تحليل الفحوص المخبرية للمرضى"},{"key":"د","text":"مكتب محاماة صغير يحفظ ملفات موظفيه وعملائه"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة 32(1)(ج): من كان نشاطه الأساسي معالجة بيانات حساسة، والبيانات الصحية حساسة.","misconceptions":["الحجم وحده ليس سببًا للتعيين في القطاع الخاص؛ السبب الرقابة المنتظمة أو البيانات الحساسة.","الحالة الحكومية تشترط خدمات تعالج بيانات على نطاق واسع، وبيانات الموظفين وحدها ليست كذلك.","","حفظ الملفات ليس نشاطًا أساسيًا قائمًا على بيانات حساسة أو رقابة منتظمة."],"lo":["LO1"],"day":1,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo1-6","type":"single","prompt":"يقول زميل في الشؤون القانونية: «الدليل الاسترشادي لسياسة الخصوصية يلزمنا بنموذجه حرفيًا، ومخالفته مخالفة للنظام». ما الرد الأدق؟","options":[{"key":"أ","text":"الدليل غير ملزم بنصه، والإلزام في النظام ولائحته"},{"key":"ب","text":"صحيح، فكل ما يُنشر في صفحة الأنظمة والسياسات نافذ بالقدر نفسه"},{"key":"ج","text":"صحيح بعد مرور سنة على نشر الدليل"},{"key":"د","text":"الدليل ملزم للجهات العامة وحدها"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"الدليل الاسترشادي لسياسة الخصوصية ينص على أنه ليس وثيقة تنظيمية ملزمة، فالالتزام بأحكام النظام ولائحته.","misconceptions":["","النشر في الصفحة نفسها لا يجعل الوثائق في قوة واحدة.","لا مدة تجعل الدليل الاسترشادي ملزمًا.","لا يفرق الدليل في قوته بين جهة عامة وخاصة."],"lo":["LO1"],"day":1,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo1-7","type":"single","prompt":"قرأ زميل على منصة استطلاع مشروعًا لتعديل مادة في اللائحة التنفيذية تخص عمل إدارته، فطلب تغيير الإجراء الداخلي فورًا. ما الحكم الآن؟","options":[{"key":"أ","text":"يُعمل بالمشروع من يوم نشره على منصة استطلاع"},{"key":"ب","text":"يُعمل به بعد انتهاء مدة المشاورة المعلنة على المنصة دون حاجة إلى نشر"},{"key":"ج","text":"يبقى النص الحالي نافذًا حتى يُنشر التعديل في الجريدة الرسمية"},{"key":"د","text":"يُعمل به إذا لم تعترض الجهة عليه أثناء المشاورة"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"ما على منصة استطلاع مسودة للمشاورة العامة؛ يبقى النص الحالي نافذًا حتى يصدر التعديل ويُنشر.","misconceptions":["النشر للمشاورة دعوة إلى الرأي، لا إصدار.","انتهاء المشاورة لا يعني الإقرار؛ قد يتغير النص أو يُترك.","","عدم الاعتراض لا يحول المسودة إلى نص نافذ."],"lo":["LO1"],"day":1,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo2-1","type":"single","prompt":"نظام الرواتب في إدارة الموارد البشرية يُنسخ احتياطيًا كل يوم لدى مزود سحابي، ووثيقة المزود تذكر أن مركز البيانات داخل المملكة ولا جهة فرعية له خارجها. ماذا يُكتب في سجل أنشطة المعالجة لهذا النشاط؟","options":[{"key":"أ","text":"لا شيء، فالنسخ الاحتياطي إجراء تقني لا معالجة"},{"key":"ب","text":"وصف نقل إلى خارج المملكة وأساسه النظامي، احتياطًا لأن الخدمة سحابية"},{"key":"ج","text":"موافقة كل موظف مرفقة بقيد النشاط"},{"key":"د","text":"المزود جهة معالجة بين المستلمين، و«لا يوجد» في خانة النقل"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة 33(5)(و) و(ز) من اللائحة: يذكر السجل فئات المستلمين، ويصف النقل إلى خارج المملكة إن وُجد. الاستضافة السحابية داخل المملكة ليست نقلًا، ومصدر الخانة وثيقة المزود لا الافتراض.","misconceptions":["الحفظ والنسخ معالجة بتعريف النظام، والمزود الذي يحفظ النسخ جهة معالجة تُذكر في السجل.","السحابة وحدها ليست نقلًا؛ يُكتب النقل حين تخرج البيانات من المملكة، والوثيقة تقول إنها لا تخرج.","السجل يصف الأساس النظامي، ولا يُشترط فيه إرفاق موافقات.",""],"lo":["LO2"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo2-2","type":"single","prompt":"أُوقف نشاط «استقطاب المتدربين» في إدارة الموارد البشرية نهائيًا. ماذا يحدث لقيده في سجل أنشطة المعالجة؟","options":[{"key":"أ","text":"يُحذف فورًا، فالسجل للأنشطة القائمة وحدها"},{"key":"ب","text":"يُحفظ خمس سنوات من تاريخ انتهاء النشاط"},{"key":"ج","text":"يُحفظ سنة واحدة ثم يُحذف مع بيانات المتدربين"},{"key":"د","text":"يُسلَّم إلى الجهة المختصة لتحفظه بدل الجهة"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة 33(1): يُحفظ السجل طوال مدة المعالجة وإلى خمس سنوات من تاريخ انتهاء النشاط.","misconceptions":["المادة 33 تمد حفظ السجل بعد انتهاء النشاط.","","مدة حفظ السجل غير مدة الاحتفاظ بالبيانات نفسها.","الجهة تحفظ سجلها وتتيحه للجهة المختصة عند الطلب."],"lo":["LO2"],"day":2,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo2-3","type":"single","prompt":"تتعاقد إدارة الموارد البشرية مع شركة خارجية لمعالجة الرواتب نيابة عنها. أي بند تشترط المادة 17 من اللائحة وجوده في الاتفاق؟","options":[{"key":"أ","text":"حق الشركة في استعمال البيانات لتطوير خدماتها الأخرى"},{"key":"ب","text":"إعفاء الإدارة من المسؤولية عن أي مخالفة ترتكبها الشركة"},{"key":"ج","text":"موافقة كل موظف على الاتفاق قبل توقيعه"},{"key":"د","text":"التزام الشركة بإبلاغ الإدارة دون تأخير إذا وقع تسرب"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة 17(1)(د): يتضمن الاتفاق التزام جهة المعالجة بإبلاغ جهة التحكم دون تأخير غير مبرر عند وقوع تسرب.","misconceptions":["استعمال جهة المعالجة البيانات لأغراضها يجعلها جهة تحكم مخالفة.","المادة 17(3) تبقي على جهة التحكم مسؤولية تقويم التزام جهة المعالجة.","الاتفاق بين الجهتين لا يحتاج موافقة كل صاحب بيانات.",""],"lo":["LO2"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo2-4","type":"single","prompt":"نموذج التقديم على وظيفة إدارية يطلب فصيلة الدم والحالة الاجتماعية وصورة الهوية الوطنية. ما الإجراء وفق مبدأ الحد الأدنى؟","options":[{"key":"أ","text":"إبقاء الحقول مع جعلها اختيارية للمتقدم"},{"key":"ب","text":"إبقاؤها مع تشفير قاعدة بيانات المتقدمين"},{"key":"ج","text":"حذف كل حقل لا يلزم لتقويم المتقدم للوظيفة"},{"key":"د","text":"إبقاؤها إذا وافق المتقدم على سياسة الخصوصية"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة 19 من اللائحة: جمع ما يرتبط مباشرة بالغرض وحده، ويُحدَّد ذلك بوسائل منها خرائط البيانات التي تربط كل حقل بغرضه.","misconceptions":["الحقل الاختياري جمع أيضًا متى مُلئ؛ السؤال هل يلزم للغرض.","التشفير يحمي ما جُمع، ولا يبرر جمع ما لا يلزم.","","الموافقة لا تجعل جمع ما لا يلزم للغرض متوافقًا مع المادة 19."],"lo":["LO2"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo3-1","type":"single","prompt":"أي هذه الأنشطة في إدارة الموارد البشرية يستوجب تقويم الأثر بحسب المادة 25 من اللائحة؟","options":[{"key":"أ","text":"نقل نظام الرواتب إلى خادم جديد داخل الجهة دون تغيير البيانات أو الغرض"},{"key":"ب","text":"ربط سجلات الحضور ببيانات الرواتب من نظام آخر لاحتساب الخصومات آليًا"},{"key":"ج","text":"إضافة أسماء الموظفين وتحويلاتهم الهاتفية إلى دليل داخلي"},{"key":"د","text":"إرسال كشف شهري لكل موظف عن راتبه وحده"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة 25(1)(ب) و(ج): ربط مجموعتي بيانات من مصدرين مختلفين، واتخاذ قرارات بمعالجة آلية، كلاهما يستوجب التقويم.","misconceptions":["تغيير الخادم دون تغيير البيانات أو الغرض لا يطابق أيًا من حالات المادة 25.","","دليل الهاتف الداخلي ليس بيانات حساسة ولا ربطًا ولا رقابة.","إرسال بيانات الموظف إليه وحده لا يطابق حالات المادة 25."],"lo":["LO3"],"day":3,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo3-2","type":"single","prompt":"حذفت وحدة عقود جهات العمل جدول الربط نهائيًا فلا مفتاح في أي مكان، وعممت شبه المعرّفات حتى صار في كل فئة عشرة سجلات على الأقل، واختبرت الربط بدليل الموظفين المتاح لها فلم يطابق أي سجل اسمًا واحدًا، ووثقت ذلك. كيف يُعامل المستخلص؟","options":[{"key":"أ","text":"مرمّز، فالرموز باقية في الجدول ولو حُذف المفتاح نهائيًا"},{"key":"ب","text":"مجهول الهوية، ويُعاد الاختبار كلما تغير المستخلص أو القوائم المتاحة"},{"key":"ج","text":"بيانات شخصية دائمًا، لأنها أُخذت أصلًا من بيانات شخصية"},{"key":"د","text":"مجهول الهوية نهائيًا، فلا يحتاج الحكم إلى مراجعة ما دام الاختبار قد وُثق مرة"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة 9 من اللائحة: إخفاء الهوية يتطلب التحقق من استحالة إعادة التعرف، وتقويم فعالية التقنية وتحديث التدابير، وحينها لا تعد البيانات شخصية (9(2)). الحكم قائم على اختبار موثق، ويُعاد كلما تغير المستخلص أو ما يتاح من قوائم.","misconceptions":["الترميز يفترض مفتاحًا يعيد الرموز إلى أصحابها؛ بلا مفتاح ولا ربط ممكن لا يبقى ترميز.","","المادة 9(2) من اللائحة: البيانات التي أُخفيت هويتها لا تعد بيانات شخصية متى استحال إعادة التعرف.","المادة 9(1)(ج) و(د) تطلب تحديث التدابير وتقويم فعالية التقنية؛ الحكم يُراجع."],"lo":["LO3"],"day":3,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo3-3","type":"single","prompt":"في مستخلص لموظفي إحدى الوحدات حُذفت الأسماء، وعُمِّم العمر إلى فئات عشرية، وبقي اسم القسم. في قسم واحد موظفة واحدة في الخمسينات. ما التقدير؟","options":[{"key":"أ","text":"لا خطر، فالأسماء محذوفة"},{"key":"ب","text":"الخطر في حقل العمر وحده، فيكفي حذفه"},{"key":"ج","text":"يمكن التعرف عليها من القسم وفئة العمر، فالمستخلص ليس مجهول الهوية بعد"},{"key":"د","text":"الخطر قائم فقط إذا نُشر المستخلص للعامة"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"سجل متفرد في تركيبة المعرّفات شبه المباشرة (فئة من شخص واحد) يمكن ربطه بصاحبه، فيعمم القسم أيضًا أو يُحجب ثم يُعاد الاختبار.","misconceptions":["حذف الأسماء لا يمنع التعرف من تركيب صفات أخرى.","التفرد يأتي من تركيب القسم والعمر، لا من حقل واحد.","","من يعرف الوحدة من الداخل يتعرف عليها دون نشر عام."],"lo":["LO3"],"day":3,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo3-4","type":"single","prompt":"أظهر تقويم الأثر لخدمة جديدة أنها ستضر بخصوصية أصحاب البيانات حتى بعد الضوابط المقترحة. ما الذي تطلبه اللائحة؟","options":[{"key":"أ","text":"المضي مع توثيق قبول الإدارة العليا للخطر في محضر"},{"key":"ب","text":"إرسال التقويم إلى الجهة المختصة وانتظار موافقتها"},{"key":"ج","text":"إبلاغ أصحاب البيانات بالخطر ثم المضي"},{"key":"د","text":"معالجة أسباب الضرر، ثم إعادة التقويم"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة 25(4) من اللائحة: إذا بيّن التقويم أن المعالجة تضر بالخصوصية، تعالج الجهة أسباب الضرر وتعيد التقويم.","misconceptions":["اللائحة لا تجعل قبول الإدارة بديلًا عن معالجة السبب.","لا تشترط المادة 25 موافقة مسبقة من الجهة المختصة.","الإبلاغ لا يزيل الضرر، والمادة 25(4) تطلب معالجته.",""],"lo":["LO3"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo3-5","type":"single","prompt":"خطر في إدارة الموارد البشرية: كل موظفيها يطّلعون على التقارير الطبية لطلبات الإجازة المرضية. أي ضابط يعالج سبب الخطر نفسه؟","options":[{"key":"أ","text":"صلاحيات بحسب الدور للمختصة بالإجازات"},{"key":"ب","text":"تدريب سنوي لكل موظفي الإدارة على السرية"},{"key":"ج","text":"إضافة تنبيه «سري» أعلى كل تقرير"},{"key":"د","text":"تشفير القرص الذي تُحفظ عليه التقارير"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"السبب صلاحيات أوسع من الحاجة؛ الضابط المتناسب يضيقها إلى من يحتاجها لعمله.","misconceptions":["","التدريب لا يمنع الاطلاع غير اللازم، ويبقى السبب قائمًا.","التنبيه لا يغير من يستطيع فتح التقرير.","التشفير يحمي من سرقة القرص، لا من موظف لديه صلاحية."],"lo":["LO3"],"day":3,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo4-1","type":"single","prompt":"وصل إلى إدارة الموارد البشرية بريد من عنوان شخصي غير مسجل لديها، يطلب باسم موظف حالي نسخة من ملفه. ما الخطوة الأولى؟","options":[{"key":"أ","text":"إرسال الملف إلى العنوان نفسه، فالموظف صاحب الحق"},{"key":"ب","text":"رفض الطلب، فالطلبات لا تُقبل إلا من البريد الرسمي"},{"key":"ج","text":"انتظار حضوره شخصيًا قبل تسجيل الطلب"},{"key":"د","text":"تسجيل الطلب والتحقق من هوية الطالب قبل الإفصاح"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة 3(1)(ج) و(د) من اللائحة: التحقق من هوية الطالب قبل التنفيذ، وتوثيق كل طلب يرد.","misconceptions":["الإرسال قبل التحقق قد يفصح عن ملف الموظف لغيره.","المادة 10 تترك لصاحب البيانات اختيار وسيلة التواصل المتاحة.","كل طلب يُسجَّل عند وصوله، والحضور الشخصي ليس الوسيلة الوحيدة للتحقق.",""],"lo":["LO4"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo4-2","type":"single","prompt":"احتاجت وحدة عقود جهات العمل تمديدًا للرد على طلب تصحيح، وأبلغت صاحبه مسبقًا مع السبب. ما أقصى مجموع للمهلة من يوم الاستلام؟","options":[{"key":"أ","text":"30 يومًا"},{"key":"ب","text":"45 يومًا"},{"key":"ج","text":"60 يومًا"},{"key":"د","text":"90 يومًا"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة 3(1)(أ): ثلاثون يومًا، وتمديد واحد لا يتجاوز ثلاثين أخرى، فالمجموع ستون.","misconceptions":["هذه المهلة الأصلية دون تمديد.","لا تعرف اللائحة تمديدًا بخمسة عشر يومًا.","","تسعون يومًا مهلة الشكوى إلى الجهة المختصة."],"lo":["LO4"],"day":4,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo4-3","type":"single","prompt":"أرسل متقدم سابق على وظيفة طلب نسخة من بياناته للمرة الثانية بعد ثلاثة أسابيع من الرد الكامل على طلبه الأول. وفي هذه المدة أضافت الإدارة إلى ملفه ملاحظات مقابلة ثانية. ما الرد المناسب؟","options":[{"key":"أ","text":"رفض الطلب لتكراره، مع إبلاغه بسبب الرفض"},{"key":"ب","text":"تنفيذه في مهلته بنسخة تشمل ما أُضيف إلى ملفه بعد الرد الأول"},{"key":"ج","text":"تجاهل الطلب، فقد أُجيب عن مثله قبل أسابيع"},{"key":"د","text":"إحالة الطلب إلى الجهة المختصة لتقرر بنفسها هل هو طلب متكرر"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة 3(2) من اللائحة تجيز رفض الطلب المتكرر، لكن هذا الطلب يشمل بيانات جديدة لم يطلع عليها صاحبها؛ فيُنفذ خلال 30 يومًا (3(1)(أ)) بنسخة بصيغة إلكترونية شائعة (6(2)).","misconceptions":["الطلب ليس تكرارًا لما أُجيب عنه: في الملف بيانات جديدة لم تُسلَّم له.","","لا يُترك طلب دون رد؛ والرفض نفسه يحتاج إبلاغًا بسببه.","الجهة تقرر في الطلب بنفسها، والجهة المختصة تنظر في الشكاوى."],"lo":["LO4"],"day":4,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo4-4","type":"single","prompt":"رُفض طلب موظف، فسأل في رد الإدارة: إلى متى يمكنني تقديم شكوى إلى الجهة المختصة؟ ما الذي يُكتب له؟","options":[{"key":"أ","text":"خلال 30 يومًا من تاريخ الرفض"},{"key":"ب","text":"خلال سنة من تاريخ تقديم الطلب"},{"key":"ج","text":"لا مدة للشكوى ما دامت البيانات محفوظة"},{"key":"د","text":"خلال 90 يومًا من الواقعة أو العلم بها"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة 37(1): الشكوى خلال تسعين يومًا من الواقعة أو من علم صاحب البيانات بها.","misconceptions":["ثلاثون يومًا مهلة الرد على الطلب، لا مهلة الشكوى.","اللائحة تحدد مدة أقصر من سنة.","للشكوى مدة محددة، وللجهة المختصة قبولها بعدها لعذر معقول.",""],"lo":["LO4"],"day":4,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo5-1","type":"single","prompt":"شركة خاصة جزء من مجموعة دولية تريد إرسال بيانات موظفيها إلى المقر الرئيسي في دولة أخرى لإدارة الرواتب مركزيًا. أي حالة من حالات الإعفاء في لائحة النقل تناسبها، وبأي ضمانة؟","options":[{"key":"أ","text":"حالة النقل غير المتكرر أو المحدود، فالرواتب تُرسل مرة واحدة في نهاية كل شهر"},{"key":"ب","text":"حالة البحث العلمي، فالتحليل المركزي للرواتب دراسة للبيانات"},{"key":"ج","text":"لا تحتاج حالة ولا ضمانة، فالمستلم من المجموعة نفسها"},{"key":"د","text":"العمليات المركزية في مجموعة متعددة الجنسيات، بقواعد ملزمة أو بنود قياسية"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة 4(2)(ج) من لائحة النقل: العمليات المركزية في مجموعة متعددة الجنسيات، بقواعد مشتركة ملزمة أو بنود تعاقدية قياسية أو شهادة اعتماد للمستلم.","misconceptions":["الإرسال الشهري متكرر بطبيعته.","إدارة الرواتب عملية تشغيلية، لا بحث علمي.","كل حالات الإعفاء تبقى خاضعة لضمانات مناسبة.",""],"lo":["LO5"],"day":4,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo5-2","type":"single","prompt":"اكتشفت شركة أن البنود التعاقدية القياسية التي بنت عليها استثناء نقل لم تُوقَّع فعلًا مع المستلم في الخارج، والنقل جارٍ. ما الذي تلزمها به لائحة النقل؟","options":[{"key":"أ","text":"إيقاف النقل وإبلاغ المستلمين"},{"key":"ب","text":"الاستمرار وتوقيع البنود في التجديد السنوي"},{"key":"ج","text":"الاستمرار ما دام المستلم ملتزمًا بالحماية عمليًا"},{"key":"د","text":"إبلاغ أصحاب البيانات والاستمرار"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة 6 من لائحة النقل: لا يقوم الاستثناء إذا لم تُطبَّق الضمانات المناسبة، فتوقف الجهة النقل وتبلغ الجهات التي نُقلت إليها البيانات.","misconceptions":["","الاستثناء يسقط عند غياب الضمانة، ولا ينتظر التجديد.","الالتزام العملي لا يقوم مقام الضمانة المكتوبة.","إبلاغ الأفراد لا يعيد الاستثناء."],"lo":["LO5"],"day":4,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo5-3","type":"single","prompt":"مزود في الخارج يتلقى بيانات موظفي جهة بضمانة صحيحة، ويريد إحالة جزء منها إلى متعاقد من الباطن في دولة ثالثة. ما الحكم؟","options":[{"key":"أ","text":"يسري النظام على النقل اللاحق، فيلزم ضمانة وقبول الجهة"},{"key":"ب","text":"الإحالة خارج نطاق النظام، فالبيانات غادرت المملكة"},{"key":"ج","text":"يكفي إبلاغ الجهة بعد الإحالة"},{"key":"د","text":"يجوز إذا كان المتعاقد في دولة لها نظام حماية بيانات معترف به"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة 5 من لائحة النقل: يسري النظام ولوائحه على النقل اللاحق؛ والمادة 17(5) من اللائحة: قبول مسبق من جهة التحكم لجهة المعالجة من الباطن.","misconceptions":["","المادة 5 من لائحة النقل تمد أحكام النظام إلى النقل اللاحق.","المادة 17(5) تشترط قبولًا مسبقًا من جهة التحكم للتعاقد من الباطن.","وجود نظام في الدولة الثالثة لا يغني عن الضمانة وقبول الجهة."],"lo":["LO5"],"day":4,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo6-1","type":"single","prompt":"علمت إدارة الموارد البشرية بتسرب ملف رواتب، ولم يصل الخبر إلى مسؤول حماية البيانات إلا بعد 20 ساعة. كم بقي للمسؤول من مهلة إشعار الجهة المختصة؟","options":[{"key":"أ","text":"52 ساعة"},{"key":"ب","text":"72 ساعة"},{"key":"ج","text":"48 ساعة"},{"key":"د","text":"24 ساعة"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة 24(1): 72 ساعة من علم جهة التحكم؛ مضت 20 ساعة، فبقي 52.","misconceptions":["","المهلة تبدأ من علم الجهة، لا من علم المسؤول.","هذا ناتج خصم 24 ساعة، لا ساعات التأخير الفعلية.","لا توجد مهلة 24 ساعة للإشعار في اللائحة."],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo6-2","type":"single","prompt":"اقتربت نهاية مهلة الإشعار ولم يُعرف بعد العدد الدقيق للمتأثرين. ما الذي تفعله الجهة؟","options":[{"key":"أ","text":"تؤجل الإشعار حتى يكتمل التحقيق ويُعرف العدد الدقيق للمتأثرين"},{"key":"ب","text":"ترسله في المهلة بعدد تقريبي، وتستكمل الباقي لاحقًا مع مبرر"},{"key":"ج","text":"ترسل الإشعار دون أي ذكر للعدد"},{"key":"د","text":"تبلغ الهيئة الوطنية للأمن السيبراني بدل الجهة المختصة"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة 24(1)(ب) تقبل العدد التقريبي، والمادة 24(2) تسمح بتقديم ما لم يتوافر في أقرب وقت مع مبررات التأخير.","misconceptions":["المهلة لا تمتد بانتظار التحقيق؛ المادة 24(2) تسمح بالاستكمال لاحقًا.","","البند (ب) يطلب العدد الفعلي أو التقريبي، فيُذكر التقريبي.","المادة 24(4): إبلاغ الأمن السيبراني إضافة، لا بديل."],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo6-3","type":"single","prompt":"مسودة إشعار للموظفين المتأثرين بتسرب ملف الرواتب تصف ما حدث وتذكر وسيلة التواصل مع المسؤول. ما الذي ينقصها مما تطلبه المادة 24(5)؟","options":[{"key":"أ","text":"اسم الموظف الذي تسبب في التسرب"},{"key":"ب","text":"رقم البلاغ الأمني الداخلي"},{"key":"ج","text":"وصف المخاطر وما اتُّخذ لتقليلها، والنصائح للموظف"},{"key":"د","text":"الأساس النظامي لمعالجة الرواتب ومدة الاحتفاظ بها في الإدارة"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة 24(5): وصف التسرب، والمخاطر وما اتُّخذ لتقليلها، وبيانات التواصل، والتوصيات التي تساعد الفرد على تجنب الخطر.","misconceptions":["المادة لا تطلب تسمية المتسبب، وقد يضر ذكره.","الرقم الداخلي لا يفيد المتأثر في حماية نفسه.","","الأساس النظامي في إشعار الخصوصية، لا في إشعار التسرب."],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo6-4","type":"single","prompt":"من أين يُرسل إشعار الجهة المختصة بتسرب البيانات الشخصية بحسب الدليل الإجرائي؟","options":[{"key":"أ","text":"من خدمة الإشعار في منصة حوكمة البيانات الوطنية"},{"key":"ب","text":"من بريد الهيئة الوطنية للأمن السيبراني"},{"key":"ج","text":"من صفحة الأخبار في موقع الجهة نفسها"},{"key":"د","text":"من منصة استطلاع"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"الدليل الإجرائي لحوادث التسرب: خدمة إشعار التسرب في منصة حوكمة البيانات الوطنية، بعد التسجيل فيها.","misconceptions":["","إبلاغ الأمن السيبراني التزام آخر بحسب أنظمته.","النشر العام ليس إشعارًا للجهة المختصة.","منصة استطلاع للمشاورة العامة في مشروعات الأنظمة."],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"remember","pool":"practice"}]}</script>
